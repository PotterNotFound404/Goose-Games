<div class="topbar" data-i18n="topbar">🪿 Free honk-speed shipping on every order, because geese don't believe in patience.</div>
<header class="main">
  <div class="header-row">
    <a class="logo" href="index.html" data-i18n-title="siteTitle" title="GooseGames - Honk if you love games"><span class="beak">🪿</span><span data-i18n="siteName">Goose<span class="logo-accent">Games</span></span></a>
    <div class="search-wrap">
      <select id="filterCategory"><option value="" data-i18n="searchAll">All Games</option></select>
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search thousands of games...">
      <button id="searchBtn" type="button" aria-label="Search">🔍</button>
    </div>
    <div class="header-actions">
      <button class="header-action-btn" id="randomGameHeaderBtn" type="button" title="Pick Random Game" data-i18n-title="randomGameBtn" data-i18n="randomGameBtn">🎲 Random</button>
      <button class="header-action-btn" id="spinWheelHeaderBtn" type="button" title="Spin the Wheel" data-i18n-title="spinWheelBtn" data-i18n="spinWheelBtn">🎰 Wheel</button>
      <div class="header-tools">
        <select id="languageToggle" class="lang-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="es">ES</option>
          <option value="de">DE</option>
        </select>
        <button id="contrastToggle" class="icon-btn contrast-btn" type="button" aria-label="Toggle contrast mode" title="High Contrast Mode">◐</button>
        <button id="settingsHeaderBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙️</button>
      </div>
    </div>
  </div>
</header>
<nav class="categories" id="categoryNav"></nav>
