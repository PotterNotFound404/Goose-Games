<div class="overlay" id="drawerOverlay"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3 data-i18n="cartTitle">Your Cart 🛒</h3>
    <button id="closeDrawer" type="button" aria-label="Close cart" data-i18n-title="close">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot">
    <div class="subtotal-row"><span data-i18n="subtotal">Subtotal</span><span id="subtotalAmt">$0.00</span></div>
    <div class="checkout-actions">
      <button class="btn btn-primary" id="checkoutBtn" type="button" data-i18n="checkoutNow">Proceed to checkout</button>
      <button class="btn btn-secondary" id="clearCartBtn" type="button" data-i18n="clearCart">Clear cart</button>
      <div class="small-note" data-i18n="securePurchase">Secure checkout simulated — no real payments.</div>
    </div>
  </div>
</div>
