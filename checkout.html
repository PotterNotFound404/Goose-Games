<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooseGames Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="checkout">
  <div id="siteHeader"></div>
  <main class="checkout-shell">
    <section class="checkout-hero">
      <div>
        <div class="checkout-kicker" data-i18n="checkout">Checkout</div>
        <h1 data-i18n="checkoutTitle">Secure checkout</h1>
        <p data-i18n="checkoutSub">Enter your payment details to complete the fake order.</p>
      </div>
      <div class="checkout-total-card">
        <span data-i18n="orderTotal">Order total</span>
        <strong id="checkoutTotal">$0.00</strong>
      </div>
    </section>

    <section class="checkout-panel">
      <div id="checkoutEmpty" class="checkout-empty" style="display:none;">
        <div class="big">🪹</div>
        <p><span data-i18n="checkoutEmptyText">Your cart is empty.</span> <a href="index.html" data-i18n="continueShopping">Continue shopping</a></p>
      </div>

      <form id="checkoutForm" class="checkout-form" style="display:none;">
        <div class="field">
          <label for="ccName" data-i18n="fullName">Full name</label>
          <input type="text" id="ccName" placeholder="Goose Honker">
        </div>
        <div class="field">
          <label for="ccNumber" data-i18n="cardNumber">Card number</label>
          <input type="text" id="ccNumber" placeholder="1234 5678 9012 3456" maxlength="19">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="ccExpiry" data-i18n="expiry">Expiry</label>
            <input type="text" id="ccExpiry" placeholder="MM/YY" maxlength="5">
          </div>
          <div class="field">
            <label for="ccCvv" data-i18n="cvv">CVV</label>
            <input type="text" id="ccCvv" placeholder="123" maxlength="4">
          </div>
        </div>
        <div class="field">
          <label for="ccAddress" data-i18n="shippingAddress">Shipping address</label>
          <input type="text" id="ccAddress" placeholder="123 Pond Lane, Lakeside">
        </div>
        <div class="promo-field">
          <label for="promoCode">Promo code</label>
          <div class="promo-row"><input type="text" id="promoCode" placeholder="Enter a wheel code"><button class="btn btn-secondary" id="applyPromoBtn" type="button">Apply</button></div>
          <small id="promoMessage"></small>
        </div>
        <div class="error-text" id="checkoutError" data-i18n="checkoutError">Please fill in every field before paying.</div>
        <button class="btn btn-primary checkout-pay" id="payBtn" type="button" data-i18n="payNow">Pay now</button>
      </form>

      <div id="checkoutSuccess" class="checkout-success" style="display:none;">
        <div class="success-screen">
          <div class="icon">🪿🎉</div>
          <h2 data-i18n="paymentSuccessful">Payment successful!</h2>
          <p class="sub" data-i18n="checkoutSuccessSub">Your fake games are on their way. Thanks for shopping with GooseGames.</p>
          <a class="btn btn-secondary" href="index.html" data-i18n="backToHome">Back to home</a>
        </div>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <div id="siteCart"></div>
  <script type="module" src="js/page.js"></script>
</body>
</html>
